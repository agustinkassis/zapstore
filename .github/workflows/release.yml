name: Release APKs

# Builds a UNIVERSAL release APK (all ABIs, installs on any device — the default
# for compatibility) plus per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64) for
# smaller downloads. Push a version tag (e.g. `1.1.1` or `1.1.1-multiarch`) to
# build and publish a GitHub Release. Run manually (workflow_dispatch) to build
# without publishing and inspect the artifacts.
#
# Signing is optional and driven by the repo's existing env-var hook
# (android/app/build.gradle.kts): set the three secrets below for installable
# signed APKs, or leave them unset for UNSIGNED reproducible builds (F-Droid
# style). Reproducible builds honor SOURCE_DATE_EPOCH per spec/guidelines.
#
#   ZAPSTORE_KEYSTORE_BASE64  - `base64 -w0 your.keystore`
#   ZAPSTORE_KEY_PASSWORD     - keystore/key password
#   ZAPSTORE_KEY_ALIAS        - key alias

on:
  push:
    tags:
      # This repo tags releases without a `v` prefix (e.g. 1.1.1, 1.1.1-multiarch).
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so SOURCE_DATE_EPOCH can read the commit timestamp.
          fetch-depth: 0

      - name: Read pinned Flutter version (.fvmrc)
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter ${{ steps.flutter.outputs.version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Prepare signing key (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ZAPSTORE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/zapstore.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ZAPSTORE_KEYSTORE_BASE64 secret set — building UNSIGNED APKs (not directly installable)."
          fi

      - name: Build universal + per-ABI release APKs
        env:
          ZAPSTORE_KEY_PASSWORD: ${{ secrets.ZAPSTORE_KEY_PASSWORD }}
          ZAPSTORE_KEY_ALIAS: ${{ secrets.ZAPSTORE_KEY_ALIAS }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          if [ -f "${RUNNER_TEMP}/zapstore.keystore" ]; then
            export ZAPSTORE_KEY_PATH="${RUNNER_TEMP}/zapstore.keystore"
          fi
          flutter pub get
          out=build/app/outputs/flutter-apk
          mkdir -p dist
          # Universal APK (all ABIs in one) — installs on any device.
          flutter build apk --release
          cp "$out/app-release.apk" dist/
          # Per-ABI splits — smaller downloads. Emits arm64-v8a, armeabi-v7a, x86_64.
          flutter build apk --release --split-per-abi
          cp "$out"/app-arm64-v8a-release.apk "$out"/app-armeabi-v7a-release.apk \
             "$out"/app-x86_64-release.apk dist/
          ls -la dist/

      - name: Collect checksums
        id: artifacts
        run: |
          cd dist
          sha256sum app-*.apk | tee SHA256SUMS.txt
          echo "dir=dist" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            dist/app-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          notes="Multi-arch release built from ${GITHUB_REF_NAME}."$'\n\n'
          notes="${notes}- app-release.apk — UNIVERSAL, installs on any device (recommended)"$'\n'
          notes="${notes}- app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk / app-x86_64-release.apk — smaller, per-architecture"
          if [ "$SIGNED" != "true" ]; then
            notes="${notes}"$'\n\n'"WARNING: these APKs are unsigned (no signing secret configured) and cannot be installed as-is."
          fi
          cd "${{ steps.artifacts.outputs.dir }}"
          gh release create "$GITHUB_REF_NAME" \
            app-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk \
            app-x86_64-release.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes"
